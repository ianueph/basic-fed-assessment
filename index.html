<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> stuffed toys </title>

    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./reset.css">

    <script defer src="./script.js"></script>
</head>
<body>
    <header>
        <section class="page-heading max-width-container border">
            <div class="section-grid max-width border">
                <h1 class="border page-heading__heading"> IKEA </h1>
                <h2 class="border page-heading__subtitle"> stuffed toys </h3>
                <button class="page-heading__shopping-cart--openModal" onclick="openModal()">
                    <img src="./resources/images/shopping_cart.icon" alt="" class="shopping_cart">
                </button>
            </div>
        </section>
    </header>

    <main>
        <section class="carousel max-width-container">
            <div class="section-grid max-width border">
                carousel
                <img class="carousel__item" src="./resources/images/a_bunch_of_toys.jpg" alt="">
                <img class="carousel__item" src="./resources/images/one_big_toy.jpg" alt="">
                <img class="carousel__item" src="./resources/images/two_toys.jpg" alt="">
            </div>
        </section>


        <section class="products-list max-width-container">
            <div class="section-grid max-width border">
                <h2 class="border products-list__heading"> Product List </h2>

                <div class="products-list__grid section-grid">
                    <!-- this gets dynamically loaded using ./scripts.js-->
                </div>

                <div class="border products-list__pagination">
                    pagination
                    <!-- populate with buttons using js based on product.json-->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <section class="page-footing max-width-container">
            <div class="section-grid max-width border">
                <h2 class="border page-footing__item"> About </h2>
                <h2 class="border page-footing__item"> Contact Us </h2>
                <h2 class="border page-footing__item"> Find Us </h2>
                <h2 class="border page-footing__item"> Socials </h2>
            </div>
        </section>
    </footer>
</body>
</html>
